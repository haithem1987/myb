name: Daily Infrastructure Scale Schedule

on:
  schedule:
    # Scale DOWN: 18:00 UTC (6 PM) = Evening
    - cron: '0 18 * * *'
    # Scale UP: 06:00 UTC (6 AM) = Morning
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read

jobs:
  determine-action:
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.determine.outputs.action }}
    steps:
      - name: Determine scale action
        id: determine
        run: |
          # Scale UP at 06:00, DOWN at 18:00
          HOUR=$(date -u +%H)
          if [ "$HOUR" = "06" ]; then
            echo "action=up" >> $GITHUB_OUTPUT
          elif [ "$HOUR" = "18" ]; then
            echo "action=down" >> $GITHUB_OUTPUT
          fi

  scale-infrastructure:
    runs-on: ubuntu-latest
    needs: determine-action
    if: needs.determine-action.outputs.action != ''
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup kubeconfig
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG_BASE64 }}
        run: |
          mkdir -p ${{ runner.temp }}/.kube
          echo "$KUBECONFIG_CONTENT" | base64 -d > ${{ runner.temp }}/.kube/config
          chmod 600 ${{ runner.temp }}/.kube/config
          echo "KUBECONFIG=${{ runner.temp }}/.kube/config" >> $GITHUB_ENV
          
      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'
          
      - name: Scale UP (Morning)
        if: needs.determine-action.outputs.action == 'up'
        run: |
          echo "🚀 Scaling up infrastructure..."
          bash ./ovhcloud/scripts/scale-up.sh
          
      - name: Scale DOWN (Evening)
        if: needs.determine-action.outputs.action == 'down'
        run: |
          echo "⬇️ Scaling down infrastructure..."
          bash ./ovhcloud/scripts/scale-down.sh
          
      - name: Slack notification (on failure)
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "❌ MYB Infrastructure Scale ${{ needs.determine-action.outputs.action }} FAILED",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "❌ *MYB Infrastructure Scale Failed*\nAction: `${{ needs.determine-action.outputs.action }}`\nCheck: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                }
              ]
            }
