# GitHub Actions CI/CD Pipeline for OVHCloud Deployment
name: Deploy to OVHCloud

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
  NAMESPACE: myb-platform

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: coproperty
            dockerfile: ./src/services/coproperty-management/Myb.Coproperty/Dockerfile
            context: .
          - name: invoice
            dockerfile: ./src/services/invoice-management/Myb.Invoice/Dockerfile
            context: .
          - name: mailer
            dockerfile: ./src/services/mailer-service/Myb.Mailer/Dockerfile
            context: .
          - name: admin
            dockerfile: ./ovhcloud/docker/admin/Dockerfile
            context: ./src/front/myb.front
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/myb-${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build admin frontend (if admin)
        if: matrix.service.name == 'admin'
        run: |
          cd src/front/myb.front
          npm ci --legacy-peer-deps
          npx nx build admin --configuration=production

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'
    environment:
      name: staging
      url: https://staging.myb.yourdomain.com  # TODO: replace with your domain

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_STAGING }}

      # Kubernetes secrets are provisioned and rotated separately. Do not
      # recreate them here: this application workflow must only deploy images.

      - name: Deploy to Kubernetes
        run: |
          # Update image tags
          kubectl set image deployment/myb-coproperty \
            coproperty=${{ env.REGISTRY }}/myb-coproperty:staging-${{ github.sha }} \
            -n ${{ env.NAMESPACE }}
          
          kubectl set image deployment/myb-invoice \
            invoice=${{ env.REGISTRY }}/myb-invoice:staging-${{ github.sha }} \
            -n ${{ env.NAMESPACE }}
          
          kubectl set image deployment/myb-mailer \
            mailer=${{ env.REGISTRY }}/myb-mailer:staging-${{ github.sha }} \
            -n ${{ env.NAMESPACE }}
          
          kubectl set image deployment/myb-admin \
            admin-frontend=${{ env.REGISTRY }}/myb-admin:staging-${{ github.sha }} \
            -n ${{ env.NAMESPACE }}

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/myb-coproperty -n ${{ env.NAMESPACE }} --timeout=5m
          kubectl rollout status deployment/myb-invoice -n ${{ env.NAMESPACE }} --timeout=5m
          kubectl rollout status deployment/myb-mailer -n ${{ env.NAMESPACE }} --timeout=5m
          kubectl rollout status deployment/myb-admin -n ${{ env.NAMESPACE }} --timeout=5m

      - name: Verify deployment
        run: |
          kubectl get pods -n ${{ env.NAMESPACE }}
          kubectl get svc -n ${{ env.NAMESPACE }}

  deploy-production:
    name: Deploy to Production
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://myb.yourdomain.com  # TODO: replace with your domain

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_PROD }}

      # Kubernetes secrets are provisioned and rotated separately. Do not
      # recreate them here: this application workflow must only deploy images.

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/myb-coproperty \
            coproperty=${{ env.REGISTRY }}/myb-coproperty:latest \
            -n ${{ env.NAMESPACE }}
          
          kubectl set image deployment/myb-invoice \
            invoice=${{ env.REGISTRY }}/myb-invoice:latest \
            -n ${{ env.NAMESPACE }}
          
          kubectl set image deployment/myb-mailer \
            mailer=${{ env.REGISTRY }}/myb-mailer:latest \
            -n ${{ env.NAMESPACE }}
          
          kubectl set image deployment/myb-admin \
            admin-frontend=${{ env.REGISTRY }}/myb-admin:latest \
            -n ${{ env.NAMESPACE }}

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/myb-coproperty -n ${{ env.NAMESPACE }} --timeout=10m
          kubectl rollout status deployment/myb-invoice -n ${{ env.NAMESPACE }} --timeout=10m
          kubectl rollout status deployment/myb-mailer -n ${{ env.NAMESPACE }} --timeout=10m
          kubectl rollout status deployment/myb-admin -n ${{ env.NAMESPACE }} --timeout=10m

      - name: Run smoke tests
        run: |
          # Add your smoke tests here
          curl -f https://myb.yourdomain.com/health || exit 1  # TODO: replace with your domain

      - name: Notify on success
        if: success()
        run: |
          echo "Deployment successful!"
          # Add notification logic (Slack, email, etc.)

      - name: Rollback on failure
        if: failure()
        run: |
          kubectl rollout undo deployment/myb-coproperty -n ${{ env.NAMESPACE }}
          kubectl rollout undo deployment/myb-invoice -n ${{ env.NAMESPACE }}
          kubectl rollout undo deployment/myb-mailer -n ${{ env.NAMESPACE }}
          kubectl rollout undo deployment/myb-admin -n ${{ env.NAMESPACE }}

  run-tests:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '7.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run backend tests
        run: |
          dotnet test src/tests/unit-tests/

      - name: Run frontend tests
        run: |
          cd src/front/myb.front
          npm ci --legacy-peer-deps
          npx nx test admin --watch=false
