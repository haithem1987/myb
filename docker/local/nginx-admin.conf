# Syndic space (admin app) on http://localhost:4201. The local build is served at the root;
# /admin/... URLs (production paths used in e-mails and push notifications) are mapped onto it.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /admin/ {
        rewrite ^/admin/(.*)$ /$1 redirect;
    }

    # Owner-space links (production paths without /admin/) go to the client container.
    location /coproperty/select {
        if ($arg_space = "owner") {
            return 302 http://localhost:4200$request_uri;
        }
        try_files $uri /index.html;
    }

    location = /service-worker.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
