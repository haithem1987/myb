# Syndic space (admin app) on http://localhost:4201. The local build is served at the root;
# /admin/... URLs (production paths used in e-mails and push notifications) are mapped onto it.
# /api/... paths are proxied to backend services on the docker network (all listen on :8080).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /admin/ {
        rewrite ^/admin/(.*)$ /$1 redirect;
    }

    location /api/coproperty/ {
        proxy_pass http://myb-coproperty:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/payment/ {
        proxy_pass http://myb-payment:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/bank-statements/ {
        proxy_pass http://myb-payment:8080/api/bank-statements/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/document/ {
        proxy_pass http://myb-docmanager:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/invoice/ {
        proxy_pass http://myb-invoice:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/notification/ {
        proxy_pass http://myb-notification:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/timesheet/ {
        proxy_pass http://myb-timesheet:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Owner-space links (production paths without /admin/) go to the client container.
    location /coproperty/select {
        if ($arg_space = "owner") {
            return 302 http://localhost:4200$request_uri;
        }
        try_files $uri /index.html;
    }

    location = /service-worker.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
