# Owner space (client app) on http://localhost:4200, as in production but without the API proxy:
# the local build calls the services on their own ports (localhost:8085, 8088, ...).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # In production the syndic space lives under /admin/ on the same domain. Locally it is the
    # admin container on port 4201, so links and push notifications to /admin/... still work.
    location /admin/ {
        rewrite ^/admin/(.*)$ http://localhost:4201/$1 redirect;
    }

    # The service worker and index must never be cached, so a rebuild is picked up at once.
    location = /service-worker.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
