# ClusterIssuer – Let's Encrypt (production + staging)
# Apply: kubectl apply -f ovhcloud/k8s/cert-manager/cluster-issuer.yaml

# Production issuer – use once DNS is propagated and cert-manager is installed
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: Nidhal.BENMAAD@forlink-group.com
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
    - http01:
        ingress:
          ingressClassName: nginx
---
# Staging issuer – use to test without hitting Let's Encrypt rate limits
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: Nidhal.BENMAAD@forlink-group.com
    privateKeySecretRef:
      name: letsencrypt-staging-key
    solvers:
    - http01:
        ingress:
          ingressClassName: nginx
