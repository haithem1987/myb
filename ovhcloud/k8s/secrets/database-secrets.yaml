# Database Secrets for OVHCloud Managed Databases
#
# This is a Git-safe template. Store real values only in Kubernetes secrets or
# in an ignored local backup file; never commit them here.
apiVersion: v1
kind: Secret
metadata:
  name: database-credentials
  namespace: myb-platform
type: Opaque
stringData:
  COPROPERTY_DB_HOST: "REPLACE_WITH_YOUR_HOST"
  COPROPERTY_DB_PORT: "REPLACE_WITH_YOUR_PORT"
  COPROPERTY_DB_NAME: "copropertyDB"
  COPROPERTY_DB_USER: "coproperty_user"
  COPROPERTY_DB_PASSWORD: "REPLACE_WITH_YOUR_PASSWORD"
  COPROPERTY_DB_CONNECTION_STRING: "REPLACE_WITH_YOUR_CONNECTION_STRING"

  INVOICE_DB_HOST: "REPLACE_WITH_YOUR_HOST"
  INVOICE_DB_PORT: "REPLACE_WITH_YOUR_PORT"
  INVOICE_DB_NAME: "invoiceDB"
  INVOICE_DB_USER: "invoice_user"
  INVOICE_DB_PASSWORD: "REPLACE_WITH_YOUR_PASSWORD"
  INVOICE_DB_CONNECTION_STRING: "REPLACE_WITH_YOUR_CONNECTION_STRING"

  KEYCLOAK_DB_HOST: "REPLACE_WITH_YOUR_HOST"
  KEYCLOAK_DB_PORT: "REPLACE_WITH_YOUR_PORT"
  KEYCLOAK_DB_NAME: "keycloak"
  KEYCLOAK_DB_USER: "keycloak_user"
  KEYCLOAK_DB_PASSWORD: "REPLACE_WITH_YOUR_PASSWORD"
  KEYCLOAK_DB_URL: "REPLACE_WITH_YOUR_KEYCLOAK_DB_URL"

  NOTIFICATION_DB_HOST: "REPLACE_WITH_YOUR_HOST"
  NOTIFICATION_DB_PORT: "REPLACE_WITH_YOUR_PORT"
  NOTIFICATION_DB_NAME: "notificationDB"
  NOTIFICATION_DB_USER: "notification_user"
  NOTIFICATION_DB_PASSWORD: "REPLACE_WITH_YOUR_PASSWORD"
  NOTIFICATION_DB_CONNECTION_STRING: "REPLACE_WITH_YOUR_CONNECTION_STRING"
