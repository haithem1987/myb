# Web Push (VAPID) secret template for the Notification Service.
# Do not store real keys here. This file is intentionally excluded from kustomize, like the other
# templates in this folder. Provision the live secret per environment (myb-hprd, myb-prd), see
# docs/PUSH_NOTIFICATIONS_HANDOFF.md:
#
#   npx web-push generate-vapid-keys
#   kubectl -n <namespace> create secret generic push-vapid \
#     --from-literal=PUSH_VAPID_PUBLIC_KEY='<public key>' \
#     --from-literal=PUSH_VAPID_PRIVATE_KEY='<private key>'
#
# Keep each environment's keys stable: rotating the private key invalidates every device
# subscription. Without this secret the service runs normally with push disabled.

apiVersion: v1
kind: Secret
metadata:
  name: push-vapid
  namespace: myb-platform
type: Opaque
stringData:
  PUSH_VAPID_PUBLIC_KEY: "REPLACE_WITH_VAPID_PUBLIC_KEY"
  PUSH_VAPID_PRIVATE_KEY: "REPLACE_WITH_VAPID_PRIVATE_KEY"
