# SMTP Secret template for the Mailer Service.
# Do not store credentials here. Provision the live secret with
# scripts/setup-gmail-smtp.sh; this file is intentionally excluded from kustomize.

apiVersion: v1
kind: Secret
metadata:
  name: smtp-credentials
  namespace: myb-platform
type: Opaque
stringData:
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_USERNAME: "REPLACE_WITH_GMAIL_ADDRESS"
  SMTP_PASSWORD: "REPLACE_WITH_GMAIL_APP_PASSWORD"
  EMAIL_FROM_ADDRESS: "REPLACE_WITH_GMAIL_ADDRESS"
  EMAIL_FROM_NAME: "MYB Platform"
  SMTP_ENABLE_SSL: "false"
  SMTP_STARTTLS: "true"
  SMTP_AUTH: "true"
