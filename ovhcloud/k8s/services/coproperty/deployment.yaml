# Coproperty Management Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myb-coproperty
  namespace: myb-platform
  labels:
    app: myb-coproperty
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myb-coproperty
  template:
    metadata:
      labels:
        app: myb-coproperty
        tier: backend
    spec:
      imagePullSecrets:
      - name: harbor-registry-credentials
      containers:
      - name: coproperty
        image: 93pf2bi9.gra7.container-registry.ovh.net/myb/myb-coproperty:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: ASPNETCORE_ENVIRONMENT
        - name: ConnectionStrings__CopropertyDBConnection
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: COPROPERTY_DB_CONNECTION_STRING
        - name: Keycloak__BaseUrl
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: KEYCLOAK_BASE_URL
        - name: Keycloak__Authority
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: KEYCLOAK_AUTHORITY
        - name: Keycloak__ClientId
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: KEYCLOAK_CLIENT_ID
        - name: Keycloak__ClientSecret
          valueFrom:
            secretKeyRef:
              name: keycloak-credentials
              key: KEYCLOAK_CLIENT_SECRET
        - name: Keycloak__ServiceClientId
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: KEYCLOAK_SERVICE_CLIENT_ID
        - name: Keycloak__ServiceClientSecret
          valueFrom:
            secretKeyRef:
              name: keycloak-credentials
              key: KEYCLOAK_SERVICE_CLIENT_SECRET
        - name: Keycloak__ManagerRole
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: KEYCLOAK_MANAGER_ROLE
        - name: Keycloak__ClientUuid
          value: "10bbc5e8-34ba-4f2c-9369-39d326839f0e"
        - name: Services__FrontendUrl
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: FRONTEND_URL
        - name: RabbitMq__Host
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: RABBITMQ_HOST
        resources:
          requests:
            memory: "384Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: myb-coproperty
  namespace: myb-platform
spec:
  selector:
    app: myb-coproperty
  ports:
  - name: http
    port: 8088
    targetPort: 8080
  type: ClusterIP
