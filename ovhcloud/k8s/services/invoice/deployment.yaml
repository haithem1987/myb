# Invoice Management Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myb-invoice
  namespace: myb-platform
  labels:
    app: myb-invoice
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myb-invoice
  template:
    metadata:
      labels:
        app: myb-invoice
        tier: backend
    spec:
      imagePullSecrets:
      - name: harbor-registry-credentials
      containers:
      - name: invoice
        image: 93pf2bi9.gra7.container-registry.ovh.net/myb/myb-invoice:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: ASPNETCORE_ENVIRONMENT
        - name: ConnectionStrings__InvoiceDBConnection
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: INVOICE_DB_CONNECTION_STRING
        - name: Keycloak__BaseUrl
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: KEYCLOAK_BASE_URL
        - name: Keycloak__Authority
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: KEYCLOAK_AUTHORITY
        - name: Keycloak__ClientId
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: KEYCLOAK_CLIENT_ID
        - name: Keycloak__ClientSecret
          valueFrom:
            secretKeyRef:
              name: keycloak-credentials
              key: KEYCLOAK_CLIENT_SECRET
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: myb-invoice
  namespace: myb-platform
spec:
  selector:
    app: myb-invoice
  ports:
  - name: http
    port: 8083
    targetPort: 8080
  type: ClusterIP
