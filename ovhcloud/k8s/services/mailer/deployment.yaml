# Mailer Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myb-mailer
  namespace: myb-platform
  labels:
    app: myb-mailer
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myb-mailer
  template:
    metadata:
      labels:
        app: myb-mailer
        tier: backend
    spec:
      imagePullSecrets:
      - name: harbor-registry-credentials
      containers:
      - name: mailer
        image: 93pf2bi9.gra7.container-registry.ovh.net/myb/myb-mailer:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: ASPNETCORE_ENVIRONMENT
        - name: RabbitMq__Host
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: RABBITMQ_HOST
        - name: Smtp__Host
          valueFrom:
            secretKeyRef:
              name: smtp-credentials
              key: SMTP_HOST
        - name: Smtp__Port
          valueFrom:
            secretKeyRef:
              name: smtp-credentials
              key: SMTP_PORT
        - name: Smtp__FromAddress
          valueFrom:
            secretKeyRef:
              name: smtp-credentials
              key: EMAIL_FROM_ADDRESS
        - name: Smtp__FromName
          valueFrom:
            secretKeyRef:
              name: smtp-credentials
              key: EMAIL_FROM_NAME
        - name: Smtp__EnableSsl
          valueFrom:
            secretKeyRef:
              name: smtp-credentials
              key: SMTP_ENABLE_SSL
        - name: Smtp__StartTls
          valueFrom:
            secretKeyRef:
              name: smtp-credentials
              key: SMTP_STARTTLS
        - name: Smtp__Username
          valueFrom:
            secretKeyRef:
              name: smtp-credentials
              key: SMTP_USERNAME
        - name: Smtp__Password
          valueFrom:
            secretKeyRef:
              name: smtp-credentials
              key: SMTP_PASSWORD
        resources:
          requests:
            memory: "256Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: myb-mailer
  namespace: myb-platform
spec:
  selector:
    app: myb-mailer
  ports:
  - name: http
    port: 8089
    targetPort: 8080
  type: ClusterIP
