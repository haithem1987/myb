# Notification Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myb-notification
  namespace: myb-platform
  labels:
    app: myb-notification
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myb-notification
  template:
    metadata:
      labels:
        app: myb-notification
        tier: backend
    spec:
      imagePullSecrets:
      - name: harbor-registry-credentials
      containers:
      - name: notification
        image: 93pf2bi9.gra7.container-registry.ovh.net/myb/myb-notification:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8084
          name: http
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: ASPNETCORE_ENVIRONMENT
        - name: ASPNETCORE_URLS
          value: "http://+:8084"
        - name: ConnectionStrings__NotificationDBConnection
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: NOTIFICATION_DB_CONNECTION_STRING
        - name: Keycloak__Authority
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: KEYCLOAK_AUTHORITY
        - name: Keycloak__ClientId
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: KEYCLOAK_CLIENT_ID
        - name: RabbitMq__Host
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: RABBITMQ_HOST
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8084
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8084
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: myb-notification
  namespace: myb-platform
spec:
  selector:
    app: myb-notification
  ports:
  - name: http
    port: 8084
    targetPort: 8084
  type: ClusterIP
