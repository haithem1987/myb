# Payment and subscription service deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myb-payment
  namespace: myb-platform
  labels:
    app: myb-payment
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myb-payment
  template:
    metadata:
      labels:
        app: myb-payment
        tier: backend
    spec:
      imagePullSecrets:
      - name: harbor-registry-credentials
      containers:
      - name: payment
        image: 93pf2bi9.gra7.container-registry.ovh.net/myb/myb-payment:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8084
          name: http
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: ASPNETCORE_ENVIRONMENT
        - name: ASPNETCORE_URLS
          value: "http://+:8084"
        # Payment tables and migration history live in the dedicated `payment`
        # PostgreSQL schema, isolated from coproperty's public tables.
        - name: ConnectionStrings__PaymentDBConnection
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: COPROPERTY_DB_CONNECTION_STRING
        - name: Keycloak__BaseUrl
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: KEYCLOAK_BASE_URL
        - name: Keycloak__Authority
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: KEYCLOAK_AUTHORITY
        - name: Keycloak__PublicAuthority
          value: "https://myb-platform.com/auth/realms/MYB"
        - name: Keycloak__ClientId
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: KEYCLOAK_CLIENT_ID
        - name: Keycloak__ClientSecret
          valueFrom:
            secretKeyRef:
              name: keycloak-credentials
              key: KEYCLOAK_CLIENT_SECRET
        - name: RabbitMq__Host
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: RABBITMQ_HOST
        resources:
          requests:
            memory: "256Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8084
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8084
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: myb-payment
  namespace: myb-platform
spec:
  selector:
    app: myb-payment
  ports:
  - name: http
    port: 8084
    targetPort: 8084
  type: ClusterIP
