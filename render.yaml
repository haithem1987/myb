      - key: Keycloak__BaseUrl
        value: ${KEYCLOAK_URL}/realms/MYB/protocol/openid-connect
      - key: Keycloak__Authority
        value: ${KEYCLOAK_URL}/realms/MYB
      - key: Keycloak__ClientId
        value: ${KEYCLOAK_CLIENT_ID}
      - key: Keycloak__ClientSecret
        value: ${KEYCLOAK_CLIENT_SECRET}
      - key: SendGrid__ApiKey
        value: ${SENDGRID_API_KEY}
      - key: Email__FromAddress
        value: ${EMAIL_FROM_ADDRESS}
    depends_on:
      - keycloak

  coproperty:
    type: web
    name: myb-coproperty
    runtime: docker
    plan: standard
    region: oregon
    buildCommand: ""
    dockerfilePath: ./src/services/coproperty-management/Myb.Coproperty/Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: ConnectionStrings__CopropertyDBConnection
        fromDatabase:
          name: coproperty-db
          property: connectionString
      - key: Keycloak__BaseUrl
        value: ${KEYCLOAK_URL}/realms/MYB/protocol/openid-connect
      - key: Keycloak__Authority
        value: ${KEYCLOAK_URL}/realms/MYB
      - key: Keycloak__ClientId
        value: ${KEYCLOAK_CLIENT_ID}
      - key: Keycloak__ClientSecret
        value: ${KEYCLOAK_CLIENT_SECRET}
    depends_on:
      - keycloak
      - coproperty-db

  # ===== FRONTEND SERVICE =====

  frontend:
    type: web
    name: myb-frontend
    runtime: docker
    plan: standard
    region: oregon
    buildCommand: ""
    dockerfilePath: ./src/front/myb.front/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: KEYCLOAK_URL
        value: ${KEYCLOAK_URL}
      - key: KEYCLOAK_REALM
        value: MYB
      - key: KEYCLOAK_CLIENT_ID
        value: ${KEYCLOAK_CLIENT_ID}
      - key: API_BASE_URL
        value: ${API_BASE_URL}
    depends_on:
      - keycloak
      - user-manager
      - timesheet
      - document-manager
      - invoice
      - payment
      - notification
      - coproperty
