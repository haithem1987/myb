services:
  # ===== DATABASES =====
  
  - type: pserv
    name: keycloak-db
    plan: starter
    databaseName: keycloak
    databaseUser: keycloak
    region: oregon

  - type: pserv
    name: timesheet-db
    plan: starter
    databaseName: timesheetDB
    databaseUser: postgres
    region: oregon

  - type: pserv
    name: document-db
    plan: starter
    databaseName: documentDB
    databaseUser: postgres
    region: oregon

  - type: pserv
    name: invoice-db
    plan: starter
    databaseName: invoiceDB
    databaseUser: postgres
    region: oregon

  - type: pserv
    name: coproperty-db
    plan: starter
    databaseName: copropertyDB
    databaseUser: postgres
    region: oregon

  # ===== KEYCLOAK SERVICE =====
  
  - type: web
    name: myb-keycloak
    env: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile.keycloak
    dockerCommand: start --db=postgres
    envVars:
      - key: KC_BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: KC_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: KC_DB
        value: postgres
      - key: KC_DB_URL
        fromDatabase:
          name: keycloak-db
          property: connectionString
      - key: KC_DB_USERNAME
        value: keycloak
      - key: KC_DB_PASSWORD
        fromDatabase:
          name: keycloak-db
          property: password
      - key: KC_HOSTNAME_STRICT
        value: "false"
      - key: KC_HTTP_ENABLED
        value: "true"
      - key: KC_PROXY
        value: edge
      - key: KC_HOSTNAME_STRICT_HTTPS
        value: "false"

  # ===== BACKEND SERVICES =====

  - type: web
    name: myb-usermanager
    env: docker
    plan: starter
    region: oregon
    dockerfilePath: ./src/services/user-manager/Myb.UserManager/Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: ConnectionStrings__UserDBConnection
        fromDatabase:
          name: timesheet-db
          property: connectionString
      - key: Keycloak__BaseUrl
        sync: false
      - key: Keycloak__Authority
        sync: false
      - key: Keycloak__ClientId
        value: MYB-client
      - key: Keycloak__ClientSecret
        sync: false

  - type: web
    env: docker
    name: myb-timesheet
    plan: starter
    region: oregon
    dockerfilePath: ./src/services/time-sheet/Myb.Timesheet/Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: ConnectionStrings__TimesheetDBConnection
        fromDatabase:
          name: timesheet-db
          property: connectionString
      - key: Keycloak__BaseUrl
        sync: false
      - key: Keycloak__Authority
        sync: false
      - key: Keycloak__ClientId
        value: MYB-client
      - key: Keycloak__ClientSecret
        sync: false

  - type: web
    env: docker
    name: myb-docmanager
    plan: starter
    region: oregon
    dockerfilePath: ./src/services/document-management/Myb.Document/Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: ConnectionStrings__DocumentDBConnection
        fromDatabase:
          name: document-db
          property: connectionString
      - key: Keycloak__BaseUrl
        sync: false
      - key: Keycloak__Authority
        sync: false
      - key: Keycloak__ClientId
        value: MYB-client
      - key: Keycloak__ClientSecret
        sync: false

  - type: web
    env: docker
    name: myb-invoice
    plan: starter
    region: oregon
    dockerfilePath: ./src/services/invoice-management/Myb.Invoice/Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: ConnectionStrings__InvoiceDBConnection
        fromDatabase:
          name: invoice-db
          property: connectionString
      - key: Keycloak__BaseUrl
        sync: false
      - key: Keycloak__Authority
        sync: false
      - key: Keycloak__ClientId
        value: MYB-client
      - key: Keycloak__ClientSecret
        sync: false

  - env: docker
    type: web
    name: myb-payment
    plan: starter
    region: oregon
    dockerfilePath: ./src/services/payment-service/Myb.Payment/Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: Keycloak__BaseUrl
        sync: false
      - key: Keycloak__Authority
        sync: false
      - key: Keycloak__ClientId
        value: MYB-client
      - key: Keycloak__ClientSecret
        sync: false
      - key: Stripe__SecretKey
        sync: false
      - key: Stripe__PublishableKey
        sync: false

  - env: docker
    type: web
    name: myb-notification
    plan: starter
    region: oregon
    dockerfilePath: ./src/services/notification-service/Myb.Notification/Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: Keycloak__BaseUrl
        sync: false
      - key: Keycloak__Authority
        sync: false
      - key: Keycloak__ClientId
        value: MYB-client
      - key: Keycloak__ClientSecret
        sync: false
      - key: SendGrid__ApiKey
        sync: false
      - key: Email__FromAddress
        value: noreply@myb.com

  - env: docker
    type: web
    name: myb-coproperty
    plan: starter
    region: oregon
    dockerfilePath: ./src/services/coproperty-management/Myb.Coproperty/Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: ConnectionStrings__CopropertyDBConnection
        fromDatabase:
          name: coproperty-db
          property: connectionString
      - key: Keycloak__BaseUrl
        sync: false
      - key: Keycloak__Authority
        sync: false
      - key: Keycloak__ClientId
        value: MYB-client
      - key: Keycloak__ClientSecret
        sync: false

  # ===== FRONTEND SERVICE =====

  - env: docker
    type: web
    name: myb-frontend
    plan: starter
    region: oregon
    dockerfilePath: ./src/front/myb.front/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: KEYCLOAK_URL
        sync: false
      - key: KEYCLOAK_REALM
        value: MYB
      - key: KEYCLOAK_CLIENT_ID
        value: MYB-client
      - key: API_BASE_URL
        sync: false
