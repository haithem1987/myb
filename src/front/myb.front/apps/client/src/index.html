<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MYB — Manage Your Business</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#173b75" />
    <meta name="description" content="Manage your MYB coproperty space from any device." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MYB" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <style>
      .bootstrap-loading{position:fixed;inset:0;display:grid;place-items:center;background:#f8fafc;color:#334155;font:600 15px system-ui,sans-serif}.bootstrap-loading__card{display:flex;align-items:center;gap:12px;padding:18px 22px;border:1px solid #e2e8f0;border-radius:12px;background:#fff;box-shadow:0 12px 35px rgba(15,23,42,.12)}.bootstrap-loading__spinner{width:26px;height:26px;border:3px solid #dbeafe;border-top-color:#2563eb;border-radius:50%;animation:bootstrap-spin .75s linear infinite}@keyframes bootstrap-spin{to{transform:rotate(360deg)}}
    </style>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body>
    <myb-front-root><div class="bootstrap-loading" role="status" aria-live="polite"><div class="bootstrap-loading__card"><span class="bootstrap-loading__spinner" aria-hidden="true"></span><span>Chargement…</span></div></div></myb-front-root>
  </body>
</html>
