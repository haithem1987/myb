<div class="delete-fund-call-modal">
  <div class="modal-body">
    <div class="alert alert-warning d-flex align-items-start gap-2 mb-3" role="alert">
      <i class="bi bi-exclamation-triangle-fill mt-1"></i>
      <div>
        <div class="fw-semibold">Cette action est irréversible.</div>
        <div>L'appel de fonds sera définitivement supprimé. Cette opération ne peut pas être annulée.</div>
      </div>
    </div>

    <p class="mb-2">Pour confirmer, saisissez <strong>exactement</strong> la description suivante&nbsp;:</p>
    <blockquote class="blockquote border-start border-3 border-warning ps-3 py-2 mb-3 bg-light">
      {{ requiredDescription }}
    </blockquote>

    <div *ngIf="preconditionNote" class="small text-muted mb-3">
      <i class="bi bi-shield-check me-1"></i>{{ preconditionNote }}
    </div>

    <label for="deleteTypedConfirmation" class="form-label fw-semibold">
      Confirmation
    </label>
    <input id="deleteTypedConfirmation"
           type="text"
           class="form-control"
           autocomplete="off"
           spellcheck="false"
           [value]="typed()"
           (input)="onTypedChange($any($event.target).value)"
           placeholder="Retapez la description ci-dessus">
    <small *ngIf="typed().length > 0 && !canConfirm()" class="text-danger">
      La saisie ne correspond pas à la description attendue.
    </small>
  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="dismiss()" [disabled]="isDeleting()">
      Annuler
    </button>
    <button type="button"
            class="btn btn-danger"
            (click)="confirmDelete()"
            [disabled]="!canConfirm() || isDeleting()"
            [title]="!canConfirm() ? 'Saisissez la description exacte pour confirmer' : 'Supprimer définitivement'">
      <span *ngIf="!isDeleting()">
        <i class="bi bi-trash me-1"></i>Supprimer définitivement
      </span>
      <span *ngIf="isDeleting()">
        <span class="spinner-border spinner-border-sm me-1" role="status"></span>Suppression…
      </span>
    </button>
  </div>
</div>
