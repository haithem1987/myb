<myb-auth-layout [currentStep]="1" [totalSteps]="2">
  <div class="registration-wrapper">
    <div class="registration-card">

      <!-- Logo / Brand -->
      <div class="brand-header">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="2" width="9" height="9" rx="2" fill="currentColor" opacity="0.9"/>
            <rect x="13" y="2" width="9" height="9" rx="2" fill="currentColor" opacity="0.55"/>
            <rect x="2" y="13" width="9" height="9" rx="2" fill="currentColor" opacity="0.55"/>
            <rect x="13" y="13" width="9" height="9" rx="2" fill="currentColor" opacity="0.9"/>
          </svg>
        </div>
        <h1 class="brand-title">{{ 'auth.register.title' | translate }}</h1>
        <p class="brand-subtitle">{{ 'auth.register.subtitle' | translate }}</p>
      </div>

      <!-- Email button -->
      <button class="btn btn-email w-100" (click)="registerWithEmail()">
        <i class="bi bi-envelope-fill me-2"></i>
        {{ 'auth.register.withEmail' | translate }}
      </button>

      <!-- Login link -->
      <p class="login-link">
        {{ 'auth.register.alreadyAccount' | translate }}
        <a (click)="goToLogin()" class="link-primary">
          {{ 'auth.login' | translate }}
        </a>
      </p>

    </div>
  </div>
</myb-auth-layout>
