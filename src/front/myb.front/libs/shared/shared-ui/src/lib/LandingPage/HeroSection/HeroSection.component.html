<section class="hero">
  <!-- Background blobs -->
  <div class="hero-blob hero-blob-1"></div>
  <div class="hero-blob hero-blob-2"></div>

  <div class="hero-inner">
    <!-- Left: text -->
    <div class="hero-text">
      <div class="hero-badge">
        <span class="hero-badge-dot"></span>
        Manage Your Business
      </div>
      <h1 class="hero-title">
        The smarter way to
        <span class="hero-title-gradient">run your business</span>
      </h1>
      <p class="hero-subtitle">{{ 'BEST_SOLUTION' | translate }}</p>

      <div class="hero-actions" *ngIf="!keycloakService.isAuthenticated()">
        <button class="hero-btn-primary">
          Get Started Free
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="hero-btn-ghost">Learn More</button>
      </div>

      <div class="hero-stats">
        <div class="hero-stat">
          <span class="hero-stat-num">500+</span>
          <span class="hero-stat-label">Businesses</span>
        </div>
        <div class="hero-stat-divider"></div>
        <div class="hero-stat">
          <span class="hero-stat-num">4</span>
          <span class="hero-stat-label">Modules</span>
        </div>
        <div class="hero-stat-divider"></div>
        <div class="hero-stat">
          <span class="hero-stat-num">99%</span>
          <span class="hero-stat-label">Uptime</span>
        </div>
      </div>
    </div>

    <!-- Right: SVG illustration -->
    <div class="hero-visual">
      <div class="hero-dashboard">
        <!-- Dashboard card -->
        <div class="dash-card dash-card-main">
          <div class="dash-card-header">
            <div class="dash-dot" style="background:#7c3aed"></div>
            <div class="dash-dot" style="background:#4f46e5"></div>
            <div class="dash-dot" style="background:#e0e7ff"></div>
          </div>
          <!-- Bar chart -->
          <div class="dash-chart">
            <div class="dash-bar" style="height:40%; background: linear-gradient(to top, #7c3aed, #a78bfa)"></div>
            <div class="dash-bar" style="height:70%; background: linear-gradient(to top, #4f46e5, #818cf8)"></div>
            <div class="dash-bar" style="height:55%; background: linear-gradient(to top, #7c3aed, #a78bfa)"></div>
            <div class="dash-bar" style="height:85%; background: linear-gradient(to top, #4f46e5, #818cf8)"></div>
            <div class="dash-bar" style="height:60%; background: linear-gradient(to top, #7c3aed, #a78bfa)"></div>
            <div class="dash-bar" style="height:45%; background: linear-gradient(to top, #4f46e5, #818cf8)"></div>
          </div>
          <div class="dash-label">Revenue Overview</div>
        </div>
        <!-- Floating stat badge -->
        <div class="dash-badge dash-badge-top">
          <i class="bi bi-arrow-up-right" style="color:#22c55e"></i>
          <span>+24% this month</span>
        </div>
        <!-- Floating mini card -->
        <div class="dash-badge dash-badge-bottom">
          <div class="dash-badge-icon">✓</div>
          <span>12 tasks done</span>
        </div>
      </div>
    </div>
  </div>
</section>
