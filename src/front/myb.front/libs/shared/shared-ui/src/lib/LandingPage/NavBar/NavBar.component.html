<nav class="navbar navbar-expand-lg navbar-light bg-altlight fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="#">M.Y.B</a>
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarSupportedContent"
      aria-controls="navbarSupportedContent"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0"></ul>
      <div class="d-flex align-items-center gap-2">
        <myb-front-language-switcher class="ms-3"></myb-front-language-switcher>

        <!-- Admin Portal shortcut — only visible for admin/syndic users -->
        <a
          *ngIf="isAdminUser"
          [href]="adminPortalUrl"
          class="btn btn-sm btn-warning fw-semibold"
          title="Open Admin Portal"
        >
          <i class="bi bi-shield-lock-fill me-1"></i>Admin
        </a>

        <button
          *ngIf="!keycloakService.isAuthenticated(); else userDropDown"
          class="btn btn-outline-secondary btn-sm"
          (click)="onLogin()"
        >
          Login
        </button>
        <ng-template #userDropDown>
          <myb-front-user-dropdown></myb-front-user-dropdown>
        </ng-template>
        <!-- Only show the Register button if not authenticated -->
        <button
          *ngIf="!keycloakService.isAuthenticated()"
          class="btn btn-outline-secondary btn-sm"
          (click)="onRegister()"
        >
          Register
        </button>
      </div>
    </div>
  </div>
</nav>
