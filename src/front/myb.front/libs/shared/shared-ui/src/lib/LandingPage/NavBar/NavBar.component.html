<nav class="myb-navbar">
  <div class="myb-navbar-inner">
    <!-- Brand -->
    <a class="myb-brand" href="#">
      <div class="myb-brand-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="9" height="9" rx="2" fill="currentColor" opacity="0.9"/>
          <rect x="13" y="2" width="9" height="9" rx="2" fill="currentColor" opacity="0.55"/>
          <rect x="2" y="13" width="9" height="9" rx="2" fill="currentColor" opacity="0.55"/>
          <rect x="13" y="13" width="9" height="9" rx="2" fill="currentColor" opacity="0.9"/>
        </svg>
      </div>
      <span class="myb-brand-text">{{ 'NAV_BRAND' | translate }}</span>
    </a>

    <!-- Desktop Actions -->
    <div class="myb-navbar-actions">
      <myb-front-language-switcher></myb-front-language-switcher>

      <a *ngIf="isAdminUser" [href]="adminPortalUrl" class="myb-btn-admin" title="{{ 'NAV_ADMIN' | translate }} Portal">
        <i class="bi bi-shield-lock-fill me-1"></i>{{ 'NAV_ADMIN' | translate }}
      </a>

      <ng-container *ngIf="!keycloakService.isAuthenticated(); else userDropDown">
        <button class="myb-btn-ghost" (click)="onLogin()">{{ 'NAV_LOGIN' | translate }}</button>
        <button class="myb-btn-primary" (click)="onRegister()">{{ 'NAV_GET_STARTED' | translate }}</button>
      </ng-container>
      <ng-template #userDropDown>
        <myb-front-user-dropdown></myb-front-user-dropdown>
      </ng-template>
    </div>

    <!-- Mobile Hamburger -->
    <button class="myb-hamburger" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen" aria-label="Menu">
      <span class="myb-hamburger-bar" [class.open]="menuOpen"></span>
      <span class="myb-hamburger-bar" [class.open]="menuOpen"></span>
      <span class="myb-hamburger-bar" [class.open]="menuOpen"></span>
    </button>
  </div>

  <!-- Mobile Menu Drawer -->
  <div class="myb-mobile-menu" [class.myb-mobile-menu--open]="menuOpen" (click)="$event.stopPropagation()">
    <div class="myb-mobile-menu-inner">
      <div class="myb-mobile-section">
        <myb-front-language-switcher></myb-front-language-switcher>
      </div>

      <ng-container *ngIf="!keycloakService.isAuthenticated(); else mobileUserDropDown">
        <button class="myb-btn-ghost myb-mobile-btn" (click)="onLogin(); toggleMenu()">{{ 'NAV_LOGIN' | translate }}</button>
        <button class="myb-btn-primary myb-mobile-btn" (click)="onRegister(); toggleMenu()">{{ 'NAV_GET_STARTED' | translate }}</button>
      </ng-container>
      <ng-template #mobileUserDropDown>
        <ng-container *ngIf="profile$ | async as user">
          <div class="myb-mobile-user">
            <myb-front-avatar [text]="user?.username?.toLocaleUpperCase()" [size]="32"></myb-front-avatar>
            <span class="myb-mobile-username">{{ user.username }}</span>
          </div>
          <a class="myb-mobile-link" routerLink="/profile" (click)="toggleMenu()">
            <i class="bi bi-person-circle me-2"></i>{{ 'navigation.profile' | translate }}
          </a>
          <a class="myb-mobile-link" routerLink="/coproperty/owner/dashboard" (click)="toggleMenu()" *ngIf="keycloakService.hasRole('coproperty-owner')">
            <i class="bi bi-building me-2"></i>{{ 'navigation.ownerSpace' | translate }}
          </a>
          <a class="myb-mobile-link" routerLink="/coproperty/syndic/dashboard" (click)="toggleMenu()" *ngIf="keycloakService.hasAnyRole(['coproperty-syndic','coproperty-admin'])">
            <i class="bi bi-buildings me-2"></i>{{ 'navigation.syndicSpace' | translate }}
          </a>
          <hr class="myb-mobile-divider">
          <button class="myb-mobile-link myb-mobile-link--danger" (click)="onLogout()">
            <i class="bi bi-box-arrow-right me-2"></i>{{ 'navigation.logout' | translate }}
          </button>
        </ng-container>
      </ng-template>

      <a *ngIf="isAdminUser" [href]="adminPortalUrl" class="myb-btn-admin myb-mobile-btn">
        <i class="bi bi-shield-lock-fill me-1"></i>{{ 'NAV_ADMIN' | translate }}
      </a>
    </div>
  </div>
</nav>

<!-- Overlay to close menu on outside click -->
<div class="myb-overlay" *ngIf="menuOpen" (click)="toggleMenu()"></div>
