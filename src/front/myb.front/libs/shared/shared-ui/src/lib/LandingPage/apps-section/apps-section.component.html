<section class="apps-section">
  <div class="apps-section-header">
    <div class="apps-section-icon">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="2" width="9" height="9" rx="2" fill="currentColor" opacity="0.9"/>
        <rect x="13" y="2" width="9" height="9" rx="2" fill="currentColor" opacity="0.6"/>
        <rect x="2" y="13" width="9" height="9" rx="2" fill="currentColor" opacity="0.6"/>
        <rect x="13" y="13" width="9" height="9" rx="2" fill="currentColor" opacity="0.9"/>
      </svg>
    </div>
    <h2 class="apps-section-title">{{ 'OUR_APPS' | translate }}</h2>
    <p class="apps-section-subtitle">{{ 'ALL_TOOLS' | translate }}</p>
  </div>

  <div class="apps-cards-grid">
    <div class="app-card" *ngFor="let app of list; let i = index" [style.animation-delay]="(i * 0.12) + 's'">
      <div class="app-card-icon-wrap">

        <!-- Document Management (id=2) -->
        <ng-container *ngIf="app.id === 2">
          <svg class="app-card-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Main document -->
            <rect x="10" y="8" width="36" height="46" rx="4" fill="#7c3aed" opacity="0.12"/>
            <rect x="10" y="8" width="36" height="46" rx="4" stroke="#7c3aed" stroke-width="2.5"/>
            <!-- Folded corner -->
            <path d="M34 8 L46 20 L34 20 Z" fill="#7c3aed" opacity="0.25"/>
            <path d="M34 8 L34 20 L46 20" stroke="#7c3aed" stroke-width="2" stroke-linejoin="round"/>
            <!-- Text lines -->
            <line x1="17" y1="30" x2="39" y2="30" stroke="#7c3aed" stroke-width="2.2" stroke-linecap="round"/>
            <line x1="17" y1="37" x2="39" y2="37" stroke="#7c3aed" stroke-width="2.2" stroke-linecap="round"/>
            <line x1="17" y1="44" x2="29" y2="44" stroke="#7c3aed" stroke-width="2.2" stroke-linecap="round"/>
            <!-- Pencil -->
            <rect x="40" y="42" width="8" height="18" rx="2" transform="rotate(-45 40 42)" fill="#7c3aed" opacity="0.8"/>
            <polygon points="47,55 44,58 50,57" fill="#7c3aed"/>
          </svg>
        </ng-container>

        <!-- Timesheet Management (id=1) -->
        <ng-container *ngIf="app.id === 1">
          <svg class="app-card-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Calendar body -->
            <rect x="6" y="12" width="52" height="46" rx="5" fill="#7c3aed" opacity="0.1"/>
            <rect x="6" y="12" width="52" height="46" rx="5" stroke="#7c3aed" stroke-width="2.5"/>
            <!-- Header band -->
            <rect x="6" y="12" width="52" height="14" rx="5" fill="#7c3aed" opacity="0.2"/>
            <rect x="6" y="20" width="52" height="6" fill="#7c3aed" opacity="0.1"/>
            <!-- Rings -->
            <line x1="20" y1="6" x2="20" y2="18" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
            <line x1="44" y1="6" x2="44" y2="18" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
            <!-- Grid dots -->
            <circle cx="18" cy="34" r="2.5" fill="#7c3aed"/>
            <circle cx="28" cy="34" r="2.5" fill="#7c3aed"/>
            <circle cx="38" cy="34" r="2.5" fill="#7c3aed"/>
            <circle cx="48" cy="34" r="2.5" fill="#7c3aed" opacity="0.4"/>
            <circle cx="18" cy="44" r="2.5" fill="#7c3aed"/>
            <circle cx="28" cy="44" r="2.5" fill="#7c3aed" opacity="0.4"/>
            <!-- Clock overlay -->
            <circle cx="46" cy="48" r="10" fill="white" stroke="#7c3aed" stroke-width="2"/>
            <line x1="46" y1="42" x2="46" y2="48" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
            <line x1="46" y1="48" x2="51" y2="50" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
            <circle cx="46" cy="48" r="1.5" fill="#7c3aed"/>
          </svg>
        </ng-container>

        <!-- Invoice Management (id=3) -->
        <ng-container *ngIf="app.id === 3">
          <svg class="app-card-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Receipt body -->
            <rect x="10" y="4" width="38" height="52" rx="3" fill="#7c3aed" opacity="0.1"/>
            <rect x="10" y="4" width="38" height="52" rx="3" stroke="#7c3aed" stroke-width="2.5"/>
            <!-- Zigzag bottom -->
            <polyline points="10,56 15,52 20,56 25,52 30,56 35,52 40,56 48,56" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linejoin="round"/>
            <!-- Dollar circle -->
            <circle cx="29" cy="18" r="8" fill="#7c3aed" opacity="0.15" stroke="#7c3aed" stroke-width="2"/>
            <text x="29" y="23" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c3aed" font-family="sans-serif">$</text>
            <!-- Lines -->
            <line x1="16" y1="34" x2="42" y2="34" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
            <line x1="16" y1="40" x2="34" y2="40" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
            <!-- Amount highlight -->
            <rect x="30" y="38" width="12" height="5" rx="2" fill="#7c3aed" opacity="0.2"/>
            <line x1="31" y1="40.5" x2="41" y2="40.5" stroke="#7c3aed" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </ng-container>

        <!-- Coproperty Management (id=4) -->
        <ng-container *ngIf="app.id === 4">
          <svg class="app-card-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="4" y="28" width="24" height="32" rx="3" fill="#7c3aed" opacity="0.12"/>
            <rect x="36" y="20" width="24" height="40" rx="3" fill="#7c3aed" opacity="0.12"/>
            <rect x="4" y="28" width="24" height="32" rx="3" stroke="#7c3aed" stroke-width="2.5"/>
            <rect x="36" y="20" width="24" height="40" rx="3" stroke="#7c3aed" stroke-width="2.5"/>
            <rect x="9" y="33" width="5" height="5" rx="1" fill="#7c3aed"/>
            <rect x="18" y="33" width="5" height="5" rx="1" fill="#7c3aed"/>
            <rect x="9" y="43" width="5" height="5" rx="1" fill="#7c3aed"/>
            <rect x="18" y="43" width="5" height="5" rx="1" fill="#7c3aed"/>
            <rect x="41" y="25" width="5" height="5" rx="1" fill="#7c3aed"/>
            <rect x="50" y="25" width="5" height="5" rx="1" fill="#7c3aed"/>
            <rect x="41" y="35" width="5" height="5" rx="1" fill="#7c3aed"/>
            <rect x="50" y="35" width="5" height="5" rx="1" fill="#7c3aed"/>
            <rect x="41" y="45" width="5" height="5" rx="1" fill="#7c3aed"/>
            <rect x="50" y="45" width="5" height="5" rx="1" fill="#7c3aed"/>
            <rect x="11" y="50" width="9" height="10" rx="1.5" fill="#7c3aed"/>
            <rect x="43" y="52" width="9" height="8" rx="1.5" fill="#7c3aed"/>
            <line x1="16" y1="28" x2="16" y2="18" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
            <polygon points="16,18 22,21 16,24" fill="#7c3aed"/>
          </svg>
        </ng-container>

      </div>

      <div class="app-card-body">
        <h3 class="app-card-title">{{ app.name | translate }}</h3>
        <p class="app-card-desc">{{ app.description | translate }}</p>
      </div>

      <div class="app-card-tag">
        <span>{{ app.currency }} {{ app.price }}<span class="per-month">/mo</span></span>
      </div>
    </div>
  </div>
</section>
