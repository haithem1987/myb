<div class="modal-header border-0 pb-0">
  <div class="acm-icon-wrapper">
    <i class="bi bi-shield-lock-fill"></i>
  </div>
  <h4 class="modal-title w-100 text-center mt-3">{{ 'ACCESS_CONFIRMATION' | translate }}</h4>
  <button
    type="button"
    class="btn-close"
    aria-label="Close"
    (click)="declineAccess()"
  ></button>
</div>
<div class="modal-body text-center">
  <p class="acm-message">{{ 'CONFIRMATION_MESSAGE' | translate }}</p>
</div>
<div class="modal-footer border-0 justify-content-center gap-3 pb-4">
  <button
    class="acm-btn-secondary"
    (click)="register()"
  >
    {{ 'REGISTER' | translate }}
  </button>
  <button
    class="acm-btn-primary"
    (click)="login()"
  >
    {{ 'LOGIN' | translate }}
  </button>
</div>
