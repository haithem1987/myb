<div class="empty-state" [class.empty-state--compact]="compact" role="status">
  <i class="bi" [ngClass]="icon" aria-hidden="true"></i>
  <h4>{{ title || ('NO_RESULTS_FOUND' | translate) }}</h4>
  <p *ngIf="message">{{ message }}</p>
  <div class="empty-state__actions"><ng-content></ng-content></div>
</div>
