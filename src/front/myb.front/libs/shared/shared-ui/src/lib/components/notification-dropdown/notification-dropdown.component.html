<div class="notification-wrapper" ngbDropdown>
  <button
    class="btn-notification"
    id="notificationDropdown"
    ngbDropdownToggle>
    <i class="bi bi-bell"></i>
    <span class="notification-badge" *ngIf="unreadCount > 0">
      {{ unreadCount > 99 ? '99+' : unreadCount }}
    </span>
  </button>

  <div class="dropdown-menu dropdown-menu-end notification-panel shadow" ngbDropdownMenu>
    <!-- Header -->
    <div class="notification-header">
      <h6 class="mb-0">
        <i class="bi bi-bell me-1"></i> Notifications
        <span class="badge bg-primary ms-1" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
      </h6>
      <button
        class="btn btn-sm btn-link text-decoration-none p-0"
        *ngIf="unreadCount > 0"
        (click)="onMarkAllAsRead()">
        <i class="bi bi-check-all me-1"></i>Tout lire
      </button>
    </div>

    <!-- Empty State -->
    <div *ngIf="!notifications.length" class="notification-empty">
      <i class="bi bi-bell-slash"></i>
      <p>Aucune notification</p>
    </div>

    <!-- Notification List -->
    <div class="notification-list" *ngIf="notifications.length">
      <div
        *ngFor="let notification of notifications"
        class="notification-item"
        [class.unread]="!notification.isRead"
        (click)="onNotificationClick(notification)">
        <div class="notification-icon">
          <i class="bi" [ngClass]="notification.message.includes('Paiement') ? 'bi-cash-coin text-success' : 'bi-info-circle text-primary'"></i>
        </div>
        <div class="notification-content">
          <div class="notification-message">{{ notification.message }}</div>
          <div class="notification-time">
            <i class="bi bi-clock me-1"></i>{{ getDuration(notification.createdAt) }}
          </div>
        </div>
        <div class="notification-dot" *ngIf="!notification.isRead"></div>
      </div>
    </div>
  </div>
</div>
