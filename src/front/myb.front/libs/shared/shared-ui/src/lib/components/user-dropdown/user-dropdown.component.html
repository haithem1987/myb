<!-- navigation.component.html (or wherever your navbar is defined) -->
<ul class="navbar-nav ms-auto">
  <li *ngIf="user$ | async as user" ngbDropdown class="nav-item dropdown">
    <a
      class="nav-link dropdown-toggle d-flex align-items-center"
      id="navbarDropdown"
      ngbDropdownToggle
      role="button"
      aria-expanded="false"
    >
      <myb-front-avatar
        [text]="user?.username?.toLocaleUpperCase()"
        [size]="25"
      ></myb-front-avatar>
      <span class="ms-2">{{ user.username }}</span>
    </a>
    <ul
      ngbDropdownMenu
      aria-labelledby="navbarDropdown"
      class="dropdown-menu-end"
    >
      <li *ngIf="isSystemAdmin && !isAdminApp">
        <a class="dropdown-item" href="/admin/home">
          <i class="bi bi-grid-3x3-gap-fill me-2"></i>Espace Admin
        </a>
      </li>
      <li *ngIf="isAdminApp">
        <a class="dropdown-item" href="#" (click)="$event.preventDefault(); navigateToClientApp()">
          <i class="bi bi-house-fill me-2"></i>Espace Client
        </a>
      </li>
      <li *ngIf="isCopropertyOwner && !isAdminApp">
        <a class="dropdown-item" href="/coproperty/owner/dashboard">
          <i class="bi bi-building me-2"></i>Espace Propriétaire
        </a>
      </li>
      <li *ngIf="isCopropertyMember && !isAdminApp">
        <a class="dropdown-item" routerLink="/coproperty/syndic/dashboard">
          <i class="bi bi-buildings me-2"></i>Espace Syndic
        </a>
      </li>
      <li *ngIf="isSystemAdmin || isCopropertyOwner || isCopropertyMember"><hr class="dropdown-divider" /></li>
      <li *ngIf="!isProfilePage">
        <a class="dropdown-item" href="/profile" (click)="$event.preventDefault(); navigateToProfile()">
          <i class="bi bi-person-circle me-2"></i>Mon Profil
        </a>
      </li>
      <li *ngIf="isProfilePage" class="dropdown-item disabled">
        <i class="bi bi-person-circle me-2"></i>Mon Profil
      </li>
      <li *ngIf="hasSubscriptions && !isSubscriptionsPage">
        <a class="dropdown-item" href="/subscriptions" (click)="$event.preventDefault(); navigateToSubscriptions()">
          <i class="bi bi-credit-card me-2"></i>My subscriptions
        </a>
      </li>
      <li *ngIf="hasSubscriptions && isSubscriptionsPage" class="dropdown-item disabled">
        <i class="bi bi-credit-card me-2"></i>My subscriptions
      </li>
      <li><hr class="dropdown-divider" /></li>
      <li>
        <a
          class="dropdown-item"
          href="#"
          (click)="$event.stopPropagation(); logout()"
          >Logout</a
        >
      </li>
    </ul>
  </li>
</ul>
