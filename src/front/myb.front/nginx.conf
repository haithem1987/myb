server {
    listen 80;
    listen [::]:80;

    server_name _;

    # Docker internal DNS — lazy resolution so nginx starts even if a service is down
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json;
    gzip_min_length 1000;
    gzip_vary on;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Macro for common proxy headers (repeated inline — nginx has no include in location blocks)

    location /api/coproperty/ {
        set $upstream http://myb-coproperty:8080;
        rewrite ^/api/coproperty/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/payment/ {
        set $upstream http://myb-payment:8080;
        rewrite ^/api/payment/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/document/ {
        set $upstream http://myb-docmanager:8080;
        rewrite ^/api/document/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/invoice/ {
        set $upstream http://myb-invoice:8080;
        rewrite ^/api/invoice/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/timesheet/ {
        set $upstream http://myb-timesheet:8080;
        rewrite ^/api/timesheet/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/notification/ {
        set $upstream http://myb-notification:8080;
        rewrite ^/api/notification/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api/usermanager/ {
        set $upstream http://myb-usermanager:8080;
        rewrite ^/api/usermanager/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    # Angular SPA under /admin/ (baseHref="/admin/")
    location /admin/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /admin/index.html;
    }

    location = / {
        return 302 /admin/;
    }
}
